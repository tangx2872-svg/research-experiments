{% extends 'base.html' %}
{% load bootstrap4 %}

{% block title %}
    在线学习平台 - 登录
{% endblock title %}
    

{% block body_content %}
    
    {% if user.is_authenticated %}
        <div class="container">
            <div class="jumbotron">
                <h2>您已登录。如需切换账号，请先退出登录。</h2>
            </div>
        </div>
    
    {% else %}

    <div class="container">
        <h1>登录</h1>
        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form %}
            <input type="submit" class="btn btn-primary" value="登录">
        </form>
    </div>

    {% endif %}

{% endblock body_content %}
